name: CI — Backend

on:
  push:
    branches: [main]
    paths:
      - 'gmao-backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gmao-backend/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Prisma needs a valid DATABASE_URL at generate/validate time.
      # We use a dummy MySQL URL — no real DB is needed for static checks.
      DATABASE_URL: "mysql://ci:ci@localhost:3306/ci_db"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gmao-backend/package-lock.json

      - name: Install dependencies
        working-directory: gmao-backend
        run: npm ci

      #Static Analysis

      - name: Lint
        working-directory: gmao-backend
        run: npm run lint

      - name: Check formatting
        working-directory: gmao-backend
        # Prettier in --check mode: exits with error if files are unformatted.
        run: npx prettier --check "src/**/*.{ts,json}"

      - name: Validate Prisma schema
        working-directory: gmao-backend
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: gmao-backend
        run: npx prisma generate

      - name: TypeScript type-check
        working-directory: gmao-backend
        run: npx tsc --noEmit

      #Build

      - name: Build
        working-directory: gmao-backend
        run: npm run build

      #Tests

      - name: Run tests
        working-directory: gmao-backend
        # No test runner is wired up yet (see package.json) — this is a placeholder
        # until real backend tests exist, matching gmao-frontend's vitest suite.
        run: npm test

      #Security

      - name: Audit dependencies for known vulnerabilities
        working-directory: gmao-backend
        # --audit-level=high: only fail on HIGH or CRITICAL vulnerabilities.
        run: npm audit --audit-level=high
