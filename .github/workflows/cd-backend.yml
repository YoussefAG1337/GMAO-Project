name:  CD — Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'gmao-backend/**'
      - '.github/workflows/cd-backend.yml'
  workflow_dispatch:

# Cancel in-flight runs when a new push arrives
concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Required for requesting the JWT for OIDC

jobs:
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gmao-backend/package-lock.json

      - name: Install dependencies
        working-directory: gmao-backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: gmao-backend
        run: npx prisma generate



      - name: Build backend
        working-directory: gmao-backend
        run: npm run build

      - name: Clean devDependencies (smaller payload)
        working-directory: gmao-backend
        run: npm prune --production

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: gmao-backend-tf-supra
          package: gmao-backend
