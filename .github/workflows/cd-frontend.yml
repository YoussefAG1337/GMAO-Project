name: CD — Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'gmao-frontend/**'
      - '.github/workflows/cd-frontend.yml'
  workflow_dispatch:

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Required for requesting the JWT for OIDC

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy on the main branch
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Log into Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Log into the Azure Container Registry (ACR)
      - name: Login to Azure Container Registry
        run: az acr login --name crgmaotf

      # 3. Build the Docker image and tag it
      - name: Build and push Docker image
        run: |
          cd gmao-frontend
          docker build -t crgmaotf.azurecr.io/gmao-frontend:${{ github.sha }} .
          docker push crgmaotf.azurecr.io/gmao-frontend:${{ github.sha }}

      # 4. Tell Azure Container Apps to use the new image
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: rg-gmao-tf
          containerAppName: ca-frontend-gmao-tf
          imageToDeploy: crgmaotf.azurecr.io/gmao-frontend:${{ github.sha }}