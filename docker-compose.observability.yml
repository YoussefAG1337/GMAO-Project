networks:
  observability:
    name: gmao-observability
    driver: bridge

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    container_name: gmao-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — app instrumentation exports here
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter — scraped by prometheus, published for debugging
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.10.7
    container_name: gmao-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo query API
    networks:
      - observability
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: gmao-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.5
    container_name: gmao-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3300:3000" # host 3300, not 3000 — that's already gmao-frontend's port
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
