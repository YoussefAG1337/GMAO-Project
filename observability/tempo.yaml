# Minimal single-binary Tempo config — local disk storage, no object store.
# Fine for a learning/on-prem setup; would need a real backend (S3/GCS/etc.)
# for multi-instance or long-retention production use.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # Explicit 0.0.0.0 endpoints required — unlike the OTel Collector's own
        # OTLP receiver, Tempo's defaults to 127.0.0.1 (container-internal only),
        # which silently made it unreachable from the otel-collector container.
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
