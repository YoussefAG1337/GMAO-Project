global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The Collector is the scrape target, not the app itself — it re-exposes
  # whatever OTLP metrics it received (from both gmao-backend and
  # gmao-frontend) on its own /metrics endpoint.
  #
  # honor_labels is required: the Collector's prometheus exporter already
  # stamps each series with job=<service.name> (gmao-backend, gmao-frontend).
  # Without it, Prometheus overwrites that with job="otel-collector" and
  # renames the original to exported_job — silently breaking every
  # job="gmao-backend" dashboard/alert query. (Found the hard way.)
  - job_name: 'otel-collector'
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']

  # The Collector's own internal health/self-metrics (separate port).
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']
