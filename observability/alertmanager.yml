global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'GMAO Alerts <noreply@example.com>'
  smtp_auth_username: 'your-smtp-user@example.com'
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: 'email-default'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'email-default'
    email_configs:
      - to: 'your-alert-recipient@example.com'
        send_resolved: true
