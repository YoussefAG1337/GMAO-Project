# Edit smtp_smarthost/smtp_from/smtp_auth_username below to match your SMTP
# provider (this repo uses the same Gmail SMTP already configured for
# nodemailer in gmao-backend/.env — see email.service.ts). The password is
# NOT stored here: Alertmanager has no native ${VAR} env-var expansion in its
# config file (verified against the upstream docs), so the real mechanism is
# smtp_auth_password_file, reading from a Docker secret — see
# observability/secrets/README.md.

global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'GMAO Alerts <noreply@example.com>'
  smtp_auth_username: 'your-smtp-user@example.com'
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: 'email-default'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'email-default'
    email_configs:
      - to: 'your-alert-recipient@example.com'
        send_resolved: true
